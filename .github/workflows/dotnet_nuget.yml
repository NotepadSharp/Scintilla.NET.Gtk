name: .NET NuGet Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    environment: NuGet
    runs-on: ubuntu-latest

    env:
      Solution_Name: Scintilla.NET.Abstractions.sln
      App_Project_Directory: Scintilla.NET.Abstractions
      App_Project_Path: Scintilla.NET.Abstractions/Scintilla.NET.Abstractions.csproj
      NUGET_APIKEY: ${{ secrets.NUGET_API_KEY }}
      NUGETAPI: ${{ secrets.NUGETAPI }}
      GH_PACKAGES_APIKEY: ${{ secrets.GH_PACKAGES_APIKEY }}
      PACKAGESAPI: ${{ secrets.PACKAGESAPI }}
      NUGETCONFIG: ${{ secrets.NUGETCONFIG }}

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Decode nuget.config
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          printf %s "$NUGETCONFIG" | base64 --decode > nuget.config

      - name: Debug - Show sources
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "NUGETAPI: $NUGETAPI"
          echo "PACKAGESAPI: $PACKAGESAPI"
          dotnet nuget list source

      - name: NuGet push
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          find . -name '*Scintilla.NET.Gtk*.nupkg' | while IFS= read -r line; do
            echo "Pushing package: $line"
            
            # Push to NuGet.org
            if [ -n "$NUGET_APIKEY" ] && [ -n "$NUGETAPI" ]; then
              echo "Pushing to NuGet.org..."
              dotnet nuget push "$line" --api-key "$NUGET_APIKEY" --source "$NUGETAPI" --skip-duplicate || echo "Failed to push to NuGet.org"
            fi
            
            # Push to GitHub Packages
            if [ -n "$GH_PACKAGES_APIKEY" ] && [ -n "$PACKAGESAPI" ]; then
              echo "Pushing to GitHub Packages..."
              dotnet nuget push "$line" --api-key "$GH_PACKAGES_APIKEY" --source "$PACKAGESAPI" --skip-duplicate || echo "Failed to push to GitHub Packages"
            fi
          done